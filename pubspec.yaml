name: operacao_vectra
description: Operação Vectra Work — chamados, presença e balanceamento
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icone.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icone_fg.png"
  remove_alpha_ios: true
