# Gera o APK (Android) e o build iOS sem assinatura, na nuvem.
# Actions > Build Flutter > Run workflow.
name: Build Flutter

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  # >>> ENDEREÇO DO SERVIDOR <<<
  SERVER_URL: "http://192.168.34.206:8503"

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true
      - name: Montar projeto nativo
        run: flutter create . --org br.com.vectrawork --project-name operacao_vectra --platforms=android,ios
      - name: Dependencias
        run: flutter pub get
      - name: Icones do app
        run: dart run flutter_launcher_icons
      - name: Analisar o codigo
        run: flutter analyze --no-fatal-infos || true
      - name: Gerar APK
        run: flutter build apk --release --dart-define=SERVER_URL=${{ env.SERVER_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: operacao-vectra-android
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true
      - name: Montar projeto nativo
        run: flutter create . --org br.com.vectrawork --project-name operacao_vectra --platforms=android,ios
      - name: Dependencias
        run: flutter pub get
      - name: Icones do app
        run: dart run flutter_launcher_icons
      - name: Gerar build iOS (sem assinatura)
        run: flutter build ios --release --no-codesign --dart-define=SERVER_URL=${{ env.SERVER_URL }}
      - name: Empacotar
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr operacao-vectra-ios.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: operacao-vectra-ios
          path: operacao-vectra-ios.ipa
